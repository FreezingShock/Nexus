name: Tests

# Runs the tests on every PR. When a non-draft PR from this repository passes, the second job merges that
# commit into `integration`. Conflicts and failing merged tests leave the PR untouched and add one comment.
# Never force-pushes. Never touches main.
#
# This lives in the same workflow as the tests (not a separate `workflow_run` workflow) because
# `workflow_run` only fires from the repository's default branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  integrate:
    needs: test
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: merge-into-integration
      cancel-in-progress: false
    steps:
      # tooling comes from the PR's own checkout, so it works before these scripts exist on integration
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Merge, test, push
        id: merge
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SHA"
          BEFORE="$(git rev-parse HEAD)"
          rc=0
          TOOLS="$GITHUB_WORKSPACE/tools" bash "$GITHUB_WORKSPACE/tools/scripts/ci-merge.sh" "$SHA" "Merge PR #$PR ($BRANCH) into integration" || rc=$?
          if [ "$rc" = 10 ]; then echo "result=conflict" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then echo "result=already" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! npm test > test.log 2>&1; then
            tail -n 40 test.log > test-tail.txt
            echo "result=testfail" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git push origin HEAD:integration
          echo "result=merged" >> "$GITHUB_OUTPUT"

      - name: Comment on the PR when it could not be merged
        if: steps.merge.outputs.result == 'conflict' || steps.merge.outputs.result == 'testfail'
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.merge.outputs.result }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const sha = process.env.SHA.slice(0, 7);
            const marker = `<!-- integration-merge:${process.env.RESULT}:${process.env.SHA} -->`;
            const issue_number = Number(process.env.PR);
            const { data: existing } = await github.rest.issues.listComments({ ...context.repo, issue_number, per_page: 100 });
            if (existing.some((c) => c.body.includes(marker))) { core.info('Already commented for this commit.'); return; }
            let body;
            if (process.env.RESULT === 'conflict') {
              const files = fs.readFileSync('work/conflicts.txt', 'utf8').trim().split('\n').map((f) => `- \`${f}\``).join('\n');
              body = `Could not merge \`${sha}\` into \`integration\` because of conflicts in:\n\n${files}\n\n` +
                'To fix: merge the latest `integration` into this branch (`git fetch origin && git merge origin/integration`), resolve the conflicts, run `npm run registry` if a registry `index.js` conflicts, and push. ' +
                'The merge is retried automatically after tests pass. Nothing was changed on `integration`.';
            } else {
              const tail = fs.readFileSync('work/test-tail.txt', 'utf8');
              body = `\`${sha}\` passes its own tests but the tests fail once merged with the current \`integration\`. Nothing was changed on \`integration\`.\n\n` +
                '<details><summary>Test output</summary>\n\n```\n' + tail + '\n```\n</details>\n\n' +
                'To fix: merge the latest `integration` into this branch, make the tests pass, and push.';
            }
            body += `\n\n${marker}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });

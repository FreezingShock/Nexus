name: Tests

# Runs the tests on every PR. When the PR is ready for review and targets `main` or `integration`, the second job
# merges its commit into `integration` (ci-merge.sh). The PR's live state is read first, so a re-run or a changed
# base is handled. Every run that merges, or does not, updates one status comment on the PR (scripts/ci-pr.mjs).
# A conflict or a failing merged test leaves `integration` untouched. Never force-pushes. Never touches main.
# Pushes made with GITHUB_TOKEN do not start other workflows, so the integration checks are not run after a merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  integrate:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: merge-into-integration
      cancel-in-progress: false
    steps:
      # tooling comes from the PR's own checkout, so it works before these scripts exist on integration
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the PR is ready to merge
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/scripts/ci-pr.mjs gate

      - name: Merge, test, push
        id: merge
        if: steps.gate.outputs.run == 'true'
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$SHA"
          BEFORE="$(git rev-parse HEAD)"
          rc=0
          TOOLS="$GITHUB_WORKSPACE/tools" bash "$GITHUB_WORKSPACE/tools/scripts/ci-merge.sh" "$SHA" "Merge PR #$PR ($BRANCH) into integration" || rc=$?
          if [ "$rc" = 10 ]; then echo "result=conflict" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then echo "result=already" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! npm test > test.log 2>&1; then
            tail -n 40 test.log > test-tail.txt
            echo "result=testfail" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git push origin HEAD:integration
          echo "result=merged" >> "$GITHUB_OUTPUT"

      - name: Report the outcome on the PR
        if: always() && steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ steps.merge.outcome == 'failure' && 'error' || steps.merge.outputs.result }}
        run: node tools/scripts/ci-pr.mjs report

      - name: Tell open PRs that integration moved
        if: steps.merge.outputs.result == 'merged'
        continue-on-error: true
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOLS: ${{ github.workspace }}/tools
        run: node "$TOOLS/scripts/ci-notify-behind.mjs"

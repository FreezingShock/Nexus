name: Sync main into integration

# When nate merges something into main, bring main into integration so integration is never behind it.
# A conflict fails this run (red X, email) and changes nothing. Never force-pushes.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: merge-into-integration
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge main
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          BEFORE="$(git rev-parse HEAD)"
          rc=0
          TOOLS="$GITHUB_WORKSPACE/tools" bash "$GITHUB_WORKSPACE/tools/scripts/ci-merge.sh" origin/main "Merge main into integration" || rc=$?
          if [ "$rc" = 10 ]; then echo "::error::main conflicts with integration in: $(tr '\n' ' ' < conflicts.txt)"; exit 1; fi
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then echo "integration already contains main"; exit 0; fi
          npm test
          git push origin HEAD:integration

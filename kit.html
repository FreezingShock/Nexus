<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus building kit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/kit.css">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <header class="kbar card">
    <h1 class="h-disp">Building kit</h1>
    <div class="group" id="cats" role="group" aria-label="Category"></div>
    <div class="group" id="levels" role="group" aria-label="Level"></div>
    <div class="group">
      <button class="tog" id="mode" aria-pressed="false" title="Show one size across all five levels">All levels</button>
      <button class="tog" id="turn" aria-pressed="false" title="Turn every building a quarter">Turn</button>
      <button class="tog" id="reroll" aria-pressed="false" title="Roll a different seed for every building">New seeds</button>
      <button class="tog" id="night" aria-pressed="false">Night</button>
      <select id="model" aria-label="Model"></select>
      <select id="pal" aria-label="Palette"><option value="">Palette: by seed</option><option value="warm">Warm</option><option value="pastel">Pastel</option><option value="slate">Slate</option><option value="green">Green</option></select>
    </div>
  </header>
  <aside class="kstats card" id="stats" aria-live="polite"></aside>
  <div id="labels"></div>
  <div class="hint card">Drag to pan · Scroll to zoom · Q / E to rotate · Each square is one 3 × 3 tile</div>
</div>
<script type="module" src="src/kit/kit.js"></script>
</body>
</html>
